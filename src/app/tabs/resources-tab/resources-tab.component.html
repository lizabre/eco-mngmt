<div class="tab">
    <h3>Ресурси</h3>
    <div class="form">
        <mat-form-field><mat-label>Код</mat-label><input matInput [(ngModel)]="nr.id"></mat-form-field>
        <mat-form-field class="w2"><mat-label>Назва</mat-label><input matInput [(ngModel)]="nr.name"></mat-form-field>
        <mat-form-field><mat-label>Одиниця</mat-label><input matInput [(ngModel)]="nr.unit"></mat-form-field>
        <mat-form-field><mat-label>Тариф, грн</mat-label><input matInput type="number"
                [(ngModel)]="nr.tariff"></mat-form-field>
        <button mat-flat-button color="primary" (click)="add()">Додати</button>
    </div>
    <table mat-table [dataSource]="ds.resources()">
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>Код</th>
            <td mat-cell *matCellDef="let e">{{e.id}}</td>
        </ng-container>
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Назва</th>
            <td mat-cell *matCellDef="let e">{{e.name}}</td>
        </ng-container>
        <ng-container matColumnDef="unit">
            <th mat-header-cell *matHeaderCellDef>Одиниця</th>
            <td mat-cell *matCellDef="let e">{{e.unit}}</td>
        </ng-container>
        <ng-container matColumnDef="act">
            <th mat-header-cell *matHeaderCellDef>Дії</th>
            <td mat-cell *matCellDef="let e"><button mat-icon-button color="warn"
                    (click)="ds.removeRes(e.id)"><mat-icon>delete</mat-icon></button></td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="cols"></tr>
        <tr mat-row *matRowDef="let r; columns: cols"></tr>
    </table>
</div>
